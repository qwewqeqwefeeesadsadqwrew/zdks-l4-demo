  <script>
  (function () {
    try {
      localStorage.setItem('WoLaiZhangShaoV1_unLockAllTime', String(Date.now()));
      localStorage.setItem('WoLaiZhangShaoV1_allUnLockHour', '999999');
      localStorage.setItem('WoLaiZhangShaoV1_lastSignInTime', String(Date.now()));
    } catch (e) {}
    var base = location.href.replace(/WLZS\/ZBAds\/web-mobile\/.*$/, '');
    var t = setInterval(function () {
      try {
        var mcc = window.__require && window.__require('mCore').mcc;
        if (!mcc || !mcc.vestBagMgr) return;
        if (!mcc.vestBagMgr.__zlzsPatched) {
          Object.defineProperty(mcc.vestBagMgr, 'remoteUrl', {
            get: function () { return base; },
            configurable: true
          });
          mcc.vestBagMgr.__zlzsPatched = true;
        }
        clearInterval(t);
      } catch (e) {}
    }, 25);
  })();
  </script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.40d3d.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
